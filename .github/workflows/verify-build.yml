name: Verify HollowLumen build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, test, and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'

      - name: Report environment and validate tracked lockfile
        run: |
          node --version
          npm --version
          test -f package-lock.json || { echo "::error::Committed package-lock.json is required"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(fs.readFileSync('package.json')); const l=JSON.parse(fs.readFileSync('package-lock.json')); assert.equal(l.lockfileVersion, 3); assert.deepEqual(l.packages[''].dependencies,p.dependencies); assert.deepEqual(l.packages[''].devDependencies,p.devDependencies);"

      - name: Install exactly pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify installation did not rewrite the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Audit runtime dependencies (record findings)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate design tokens
        run: node tools/validate-design-tokens.mjs

      - name: Verify generated CSS
        run: node tools/build-theme-css.mjs --check

      - name: Run all unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install isolated Playwright browser smoke dependency
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Exercise compiled site in Chromium
        run: node tools/smoke-browser.mjs

      - name: Upload palette preview screenshots
        if: ${{ always() && hashFiles('artifacts/visual/*.png') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: palette-preview-screenshots
          path: artifacts/visual/
          retention-days: 7

      - name: Upload compiled site for browser smoke testing
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: compiled-site
          path: dist/
          retention-days: 7

      - name: Verify smoke dependencies did not rewrite lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Upload pinned lockfile for traceability
        if: ${{ always() && hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          retention-days: 7
